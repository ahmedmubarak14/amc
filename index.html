<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AM Concierge — personal, discreet and worldwide private concierge services." />
    <meta name="theme-color" content="#050505" />
    <title>AM Concierge | The Art of Movement</title>
    <style>
      :root{--black:#050505;--ivory:#eee9df;--copper:#c57a4c;--ink:#171511}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--black);color:#fff;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}.hero{position:relative;padding-top:80px;background:#030303;overflow:hidden}.poster{width:100%;height:auto;object-fit:contain}.nav{position:absolute;z-index:2;inset:0 0 auto;height:80px;padding:0 4vw;display:flex;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent)}.brand img{width:72px;height:54px;object-fit:cover}.nav-note,.nav-cta{font-size:8px;letter-spacing:.22em;text-transform:uppercase}.nav-note{margin-left:auto;color:rgba(255,255,255,.45)}.nav-cta{margin-left:32px;padding:10px 14px;border:1px solid rgba(197,122,76,.65);color:#d58a5a}.details{padding:64px 7vw 24px;background:var(--ivory);color:var(--ink);display:grid;grid-template-columns:1fr 1.35fr;column-gap:10vw;row-gap:58px}.eyebrow{margin:0 0 16px;color:#a55f3b;font-size:8px;letter-spacing:.26em;text-transform:uppercase}h1{margin:0;font:400 clamp(40px,4vw,62px)/1 Georgia,'Times New Roman',serif;letter-spacing:-.045em}h1 em{color:var(--copper);font-weight:400}.contact{align-self:end;padding:24px 0;border-top:1px solid #beb5a9;border-bottom:1px solid #beb5a9;display:grid;grid-template-columns:1fr 1fr;gap:24px 42px;align-items:end}.contact>a:not(.request){display:flex;flex-direction:column;gap:8px}.contact small{color:#887f73;font-size:7px;letter-spacing:.22em;text-transform:uppercase}.contact>a span{font:14px Georgia,serif}.request{grid-column:1/-1;width:100%;padding:14px 0 10px;border-bottom:1px solid #9f9588;display:flex;justify-content:space-between;font-size:8px;letter-spacing:.22em;text-transform:uppercase}.request span{color:var(--copper)}footer{grid-column:1/-1;align-self:end;display:flex;justify-content:space-between;color:#837a6f;font-size:7px;letter-spacing:.18em;text-transform:uppercase}@media(max-width:760px){.hero{padding-top:72px}.nav{height:72px;padding:0 20px;background:#040404;border-bottom:1px solid rgba(255,255,255,.12)}.brand img{width:62px;height:46px}.nav-note{display:none}.nav-cta{margin-left:auto;font-size:7px;padding:9px 11px}.details{padding:52px 22px 24px;display:block}.statement h1{font-size:42px}.contact{margin-top:42px;grid-template-columns:1fr;gap:22px}.request{grid-column:auto}.details footer{margin-top:38px;gap:14px;flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    </style>
  </head>
  <body>
    <main>
      <section class="hero" id="home">
        <nav class="nav" aria-label="Primary navigation">
          <a class="brand" href="#home" aria-label="AM Concierge home"><img src="./public/images/am-logo.png" alt="AM — The Art of Movement" /></a>
          <span class="nav-note">Private concierge · Worldwide</span>
          <a class="nav-cta" href="mailto:am@amconcierge.co">Private request</a>
        </nav>
        <img class="poster" src="./public/images/am-simple-hero.jpg" alt="Everything handled — AM private concierge services" />
      </section>
      <section class="details" id="contact">
        <div class="statement">
          <p class="eyebrow">At your service</p>
          <h1>Personal. Discreet.<br /><em>Worldwide.</em></h1>
        </div>
        <div class="contact">
          <a href="mailto:am@amconcierge.co"><small>Email</small><span>am@amconcierge.co</span></a>
          <a href="https://instagram.com/amconcierge" target="_blank" rel="noreferrer"><small>Instagram</small><span>@amconcierge ↗</span></a>
          <a class="request" href="mailto:am@amconcierge.co">Make a private request <span>↗</span></a>
        </div>
        <footer><span>© 2026 AM Concierge</span><span>Riyadh · Worldwide</span><a href="#home">Top ↑</a></footer>
      </section>
    </main>
  </body>
</html>
